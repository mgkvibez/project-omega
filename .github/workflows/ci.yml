name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: torch-free suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Release gate (install, version, tests, API contract, torch-free wheel)
        run: bash scripts/verify.sh

  ml:
    name: torch model, trained and served
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Full suite including the torch tests
        run: python -m pytest tests -q
      - name: Train the tiny CNN
        run: python -m omega.vision.train --out models/tinycnn.pt --meta models/tinycnn.meta.json
      - name: Prove the served path uses the real weights
        run: python scripts/ml_smoke.py models/tinycnn.pt 0.9
      - name: Benchmark the checkpoint
        run: |
          python -m omega.vision.bench --checkpoint models/tinycnn.pt --runs 40 --batch 1 --json > bench-b1.json
          python -m omega.vision.bench --checkpoint models/tinycnn.pt --runs 25 --batch 32 --json > bench-b32.json
          cat bench-b1.json bench-b32.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench-b*.json
