[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-vision"
version = "0.1.0"
description = "A small vision model with a served, instrumented inference path: tiny PyTorch CNN, FastAPI serving, Prometheus metrics."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "mgkvibez"}]
keywords = ["vision", "pytorch", "fastapi", "observability", "prometheus", "mlops"]
dependencies = ["numpy>=1.24", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
ml = ["torch>=2.1", "pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27", "build>=1"]

[project.scripts]
omega = "omega.cli:main"

[tool.setuptools.packages.find]
include = ["omega*"]
